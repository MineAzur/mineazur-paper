# MineAzur — version du SERVEUR (fork Paper + plugins maison).
#
# SOURCE DE VÉRITÉ : docs/CHANGELOG_SERVEUR.md (dernier titre « ## x.y.z »).
# Fichier COMMITÉ, versionné dans le repo Paper pour que la version soit visible et tracée dans les diffs
# (contrairement à run/mineazur.yml, gitignoré, et au défaut enfoui dans MineazurConfig.java).
#
# ⚠️ Synchronisé par docs/scripts/sync_server_version.py — NE PAS éditer à la main : bumper le changelog puis
# relancer le script (cf. CLAUDE.md règle 6 et skill mineazur-publish §D).
server-version: "0.2.7"

# Bornes de changelog — HEAD de chaque repo serveur au moment du bump vers la version indiquée.
# Écrites automatiquement par docs/scripts/sync_server_version.py, uniquement quand la version CHANGE.
# Servent à retrouver ce qui reste à décrire dans docs/CHANGELOG_SERVEUR.md au bump suivant :
#     git -C <repo> log <borne de la version précédente>..HEAD
# ⚠️ Ces SHA précèdent d'un commit le bump lui-même : le premier commit listé est donc toujours ce bump.
# ⚠️ Une borne dit RÉDIGÉ, pas PUBLIÉ : TOUS les repos sont bornés, même ceux dont les notes sont restées
#    dans « Non publié » (0.1.3 : quests et jobs). Ce brouillon EST la mémoire du rédigé-non-sorti — ne
#    jamais y retirer une note sans la promouvoir dans une version, elle deviendrait introuvable.
# Plus récent en haut. Ne pas éditer à la main.
